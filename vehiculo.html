<!DOCTYPE html>
<html lang="es-AR" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehículo · Nombre Agencia</title>
  <meta name="description" content="Ficha del vehículo." />
  <meta name="theme-color" content="#0B0B0B" />
  <link rel="icon" href="img/brand/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="vehiculo" class="bg-ink pb-24 font-sans text-bone selection:bg-accent selection:text-ink lg:pb-0">
  <div id="site-header"></div>

  <main class="pt-32 md:pt-36">
    <!-- ═══ FICHA (la arma app.js a partir de ?id=) ═══ -->
    <section id="vehicle" class="mx-auto max-w-7xl px-5 md:px-10"></section>

    <!-- Estado "no encontrado" -->
    <template id="notFound">
      <div class="py-24 text-center">
        <p class="text-[11px] uppercase tracking-eyebrow text-accent">Unidad no disponible</p>
        <h1 class="mt-4 font-display text-6xl md:text-7xl">Este auto ya<br /><span class="text-bone/70">encontró dueño.</span></h1>
        <p class="mx-auto mt-6 max-w-sm text-sm text-mute">Puede que se haya vendido o que el enlace esté mal. Mirá el stock actual o pedinos una búsqueda.</p>
        <div class="mt-10 flex flex-wrap justify-center gap-3">
          <a href="stock.html" class="rounded-full bg-bone px-7 py-4 text-sm font-medium text-ink transition hover:bg-accent">Ver stock</a>
          <a data-wa="busqueda" class="rounded-full border border-white/15 px-7 py-4 text-sm transition hover:border-white/40">Pedir búsqueda</a>
        </div>
      </div>
    </template>

    <!-- ═══ RELACIONADOS ═══ -->
    <section class="mx-auto max-w-7xl px-5 py-28 md:px-10 md:py-36">
      <div class="reveal mb-12 flex items-end justify-between">
        <h2 class="font-display text-4xl leading-[.95] md:text-5xl">También te puede interesar</h2>
        <a href="stock.html" class="text-sm text-mute underline-offset-4 hover:text-bone hover:underline">Ver todo →</a>
      </div>
      <div id="related" class="grid grid-cols-1 gap-5 md:grid-cols-2 lg:grid-cols-12 lg:gap-6"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <!-- Barra fija mobile: precio + CTA siempre a mano -->
  <div id="mobileBar" class="fixed inset-x-0 bottom-0 z-40 border-t border-white/10 bg-ink/90 px-5 py-3 backdrop-blur-xl lg:hidden"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
